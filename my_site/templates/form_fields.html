{% if form.non_field_errors %}
<div class="alert alert-danger" role="alert">{{ form.non_field_errors }}</div>
{% endif %}
{% for field in form %}
<div class="mb-3">
    <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}{% if not field.field.required %} <span class="text-secondary">(optional)</span>{% endif %}</label>
    {{ field }}
    {% if field.help_text %}<div class="form-text" id="{{ field.auto_id }}_helptext">{{ field.help_text|safe }}</div>{% endif %}
    {% if field.errors %}<div class="text-danger" role="alert">{{ field.errors }}</div>{% endif %}
</div>
{% endfor %}
