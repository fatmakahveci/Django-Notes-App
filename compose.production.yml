# Use this file on its own; do not merge it with the development Compose file.
services:
  web:
    build: .
    command: ["serve-production"]
    init: true
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:?Set a unique production secret key}"
      DJANGO_ALLOWED_HOSTS: "${DOMAIN:?Set the public hostname},localhost,127.0.0.1"
      DJANGO_TRUST_PROXY_HEADERS: "true"
      DJANGO_DATABASE_PATH: /data/db.sqlite3
    volumes:
      - notes-data:/data
      - static-files:/app/src/staticfiles
    networks: [backend]

  proxy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    security_opt: ["no-new-privileges:true"]
    environment:
      DOMAIN: "${DOMAIN:?Set the public hostname}"
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - static-files:/srv/static:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [frontend, backend]

networks:
  frontend:
  backend:
    internal: true

volumes:
  notes-data:
  static-files:
  caddy-data:
  caddy-config:
