{% extends "base.html" %}
{% block title %}Delete note{% endblock %}
{% block content %}
<p>Delete “{{ post.title }}”? This cannot be undone.</p>
<form method="post" class="note-actions">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Delete permanently</button>
    <a href="{% url 'post-detail' post.pk %}">Cancel</a>
</form>
{% endblock %}
