{% if form.errors %}
<div class="alert alert-danger error-summary" role="alert" tabindex="-1" data-error-summary>
    <p>Please check your entries.</p>
    {{ form.non_field_errors }}
    {% if form.visible_fields %}<ul>{% for field in form %}{% if field.errors %}<li><a href="#{{ field.id_for_label|default:field.auto_id }}">{{ field.label }}</a></li>{% endif %}{% endfor %}</ul>{% endif %}
</div>
{% endif %}
