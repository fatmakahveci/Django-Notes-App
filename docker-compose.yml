services:
  web:
    build:
      context: .
      dockerfile: my_site/blog_app/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      DJANGO_DATABASE_PATH: "/data/db.sqlite3"
    volumes:
      - notes-data:/data
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=3).close()"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  notes-data:
