services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      DJANGO_DATABASE_PATH: "/data/db.sqlite3"
    volumes:
      - notes-data:/data

volumes:
  notes-data:
